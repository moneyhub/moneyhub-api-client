# Publish to npm via GitHub Actions OIDC (trusted publishing + provenance).
#
# Pre-releases publish with dist-tag `beta`; stable releases use the default tag.
#
# Only moneyhub/moneyhub-api-client may publish (synced private mirrors skip this workflow).
#
# Live integration / CaaS tests are not run here: they need allowlisted egress IPs and
# private secrets, and run in the private synced repo instead. Publish uses a
# GitHub-hosted runner — npm provenance does not support self-hosted runners.
name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  should-publish:
    name: Preflight
    if: ${{ github.repository == 'moneyhub/moneyhub-api-client' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.published.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "${VERSION}" ] && [ "${TAG}" != "v${VERSION}" ]; then
            echo "Release tag '${TAG}' does not match package.json version '${VERSION}' (expected '${VERSION}' or 'v${VERSION}')."
            exit 1
          fi
          echo "Release tag '${TAG}' matches package.json version '${VERSION}'."
      - name: Check if version already published
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${NAME}@${VERSION}"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Not published yet: ${NAME}@${VERSION}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    name: Lint and build
    needs: should-publish
    if: ${{ github.repository == 'moneyhub/moneyhub-api-client' && needs.should-publish.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Rebuild native modules and run prepare
        run: npm rebuild && npm run prepare --if-present
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  publish:
    name: Build and publish
    needs: [should-publish, verify]
    if: ${{ github.repository == 'moneyhub/moneyhub-api-client' && needs.should-publish.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Rebuild native modules and run prepare
        run: npm rebuild && npm run prepare --if-present
      - name: Publish to npm (stable)
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public
      - name: Publish to npm (beta)
        if: ${{ github.event.release.prerelease }}
        run: npm publish --access public --tag beta
